{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="{% static 'css/styles.css' %}"><link rel="stylesheet" href="{% static 'css/notifications.css' %}"></head>
<body>
<main class="record-form">
    <div class="brand"><div class="brand-icon">🌾</div><div><h1>{{ title }}</h1><p>Enter accurate income or expense details.</p></div></div>
    <form method="POST" style="margin-top:24px">
        {% csrf_token %}
        <div class="form-grid">
            {% for field in form %}<div class="{% if field.name == 'description' %}field-full{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
        </div>
        <div class="form-actions"><button class="primary-button" type="submit">Save Record</button><a class="secondary-button" href="{% url 'record_list' %}">Cancel</a></div>
    </form>
</main>
{% include 'farming/includes/notifications.html' %}
</body>
</html>
